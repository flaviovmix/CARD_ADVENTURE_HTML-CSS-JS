<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quebra-Cabeça</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #111;
    }

    canvas {
      border: 2px solid #333;
    }

    #game-container {
      position: relative;
    }

    .game-controls {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1000;
      display: flex;
      gap: 8px;
    }

    .game-controls button {
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .game-controls button:hover {
      background: rgba(0,0,0,0.8);
    }

    #victory-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 2000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      animation: fadeIn .5s ease;
    }
    #victory-screen.show { display: flex; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    #victory-screen img {
      max-width: min(80vw, 420px);
      max-height: 65vh;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 0 40px rgba(255,220,80,0.35);
    }

    #victory-screen h2 {
      color: #fff;
      font-family: sans-serif;
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      margin: 0;
      text-align: center;
      text-shadow: 0 0 20px rgba(255,220,80,0.6);
    }

    #btn-victory {
      background: linear-gradient(135deg, #f5a623, #e8512a);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 32px;
      font-size: 1rem;
      font-family: sans-serif;
      cursor: pointer;
      text-decoration: none;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    #btn-victory:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
  </style>
</head>

<body>
  <div class="game-controls">
    <button id="btn-back">⬅ Voltar</button>
    <button id="btn-refresh">⟳ Atualizar</button>
    <button id="btn-rotate">🔁 Rotacionar</button>
  </div>

  <div id="game-container" data-img="personagem2.png">
    <canvas id="puzzleCanvas" style="touch-action:none"></canvas>
  </div>

  <div id="victory-screen">
    <h2>🎉 Parabéns! Quebra-cabeça concluído!</h2>
    <img id="victory-img" src="" alt="imagem resolvida">
    <a id="btn-victory" href="index.html">⬅ Voltar ao início</a>
  </div>

  <script src="./assets/js/scriptJogo.js"></script>
</body>

</html>
